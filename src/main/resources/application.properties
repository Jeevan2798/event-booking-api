server.port=${PORT:8080}
spring.threads.virtual.enabled=false
server.tomcat.threads.max=200
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000

# H2 file database (zero-ops). Swap the URL for Postgres in production.
spring.datasource.url=jdbc:h2:file:./data/eventdb;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt-secret=${JWT_SECRET:}
app.mail-from=${MAIL_FROM:${SMTP_USER:noreply@example.com}}
app.brevo-api-key=${BREVO_API_KEY:}
app.sim-smtp-connections=${SIM_SMTP_CONNECTIONS:5}
app.sim-smtp-latency-ms=${SIM_SMTP_LATENCY_MS:400}

# Real SMTP (Gmail app password works)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
